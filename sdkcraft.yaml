name: copilot
adopt-info: copilot-cli
title: GitHub Copilot CLI SDK
summary: GitHub Copilot CLI - AI-powered coding assistant for the terminal
description: |
  This SDK provides the GitHub Copilot CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: https://docs.github.com/en/site-policy/github-terms/github-pre-release-license-terms
build-base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

plugs:
  copilot-config:
    interface: mount
    workshop-target: /home/workshop/.copilot

parts:
  copilot-cli:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"

      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) PLATFORM="linux-x64"   ;;
        arm64) PLATFORM="linux-arm64" ;;
        *) echo "Unsupported arch: $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac

      ASSET="copilot-${PLATFORM}.tar.gz"
      BASE_URL="https://github.com/github/copilot-cli/releases/download/v${VERSION}"

      echo "Fetching SHA256SUMS.txt for v${VERSION}..."
      SUMS="$(curl -fsSL "${BASE_URL}/SHA256SUMS.txt")"

      CHECKSUM="$(echo "$SUMS" | awk -v a="$ASSET" '$2 == a {print $1}')"
      if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
        echo "Invalid or missing checksum for ${ASSET}" >&2
        exit 1
      fi

      echo "Downloading ${BASE_URL}/${ASSET}..."
      curl -fsSL -o "$CRAFT_PART_SRC/${ASSET}" "${BASE_URL}/${ASSET}"

      ACTUAL="$(sha256sum "$CRAFT_PART_SRC/${ASSET}" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch for ${ASSET}!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/${ASSET}"
        exit 1
      fi
      echo "Checksum OK."

      tar -xzf "$CRAFT_PART_SRC/${ASSET}" -C "$CRAFT_PART_SRC"
      rm -f "$CRAFT_PART_SRC/${ASSET}"
      chmod 755 "$CRAFT_PART_SRC/copilot"
    override-build: |
      install -Dm755 "$CRAFT_PART_SRC/copilot" "$CRAFT_PRIME/bin/copilot"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
