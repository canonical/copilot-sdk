name: Build and Upload SDK

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., 1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload-amd64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    strategy:
      matrix:
        include:
          - platforms: [amd64]
            runs-on: [self-hosted, linux, jammy, x64, large]
          - platforms: [arm64]
            runs-on: [self-hosted, linux, jammy, ARM64, large]
    with:
      platforms: '["amd64"]'
      platform-flag: "--build-for"
      track: "latest"
      risk: "stable"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
  build-and-upload-arm64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["arm64"]'
      platform-flag: "--build-for"
      runs-on: '["self-hosted-linux-arm64-noble-xlarge"]'
      track: "latest"
      risk: "stable"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
