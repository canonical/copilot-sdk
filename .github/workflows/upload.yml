name: Build and Upload SDK

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., 1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    strategy:
      matrix:
        include:
          - platforms: [amd64]
            runs-on: [self-hosted, linux, jammy, x64, large]
          - platforms: [arm64]
            runs-on: [self-hosted, linux, jammy, ARM64, large]
    with:
      runs-on: ${{ toJSON(matrix.runs-on) }}
      platforms: ${{ toJSON(matrix.platforms) }}
      risk: "stable"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
