summary: setup-base installs bash completion for the copilot CLI

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # setup-base writes the generated completion to the standard directory.
  workshop exec -- test -s /etc/bash_completion.d/copilot
  workshop exec -- grep -q 'complete -o default -F _copilot copilot' \
    /etc/bash_completion.d/copilot
