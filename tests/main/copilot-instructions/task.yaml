summary: setup-project hook installs the workshop prompt as ~/.copilot/copilot-instructions.md

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # setup-project installs the workshop prompt as ~/.copilot/copilot-instructions.md,
  # which Copilot CLI reads natively as user instructions on every invocation.
  workshop exec -- test -f /home/workshop/.copilot/copilot-instructions.md
  workshop exec -- head -1 /home/workshop/.copilot/copilot-instructions.md | \
    MATCH "Workshop Container Environment Instructions"

debug: |
  workshop exec -- ls -la /home/workshop/.copilot/ || true
  workshop exec -- cat /home/workshop/.copilot/copilot-instructions.md || true
